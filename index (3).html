<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Computer - Hiro Marker</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif}
#panel{
 position:fixed;left:50%;bottom:15px;transform:translateX(-50%);
 width:94%;max-width:480px;padding:14px;border-radius:20px;
 background:rgba(15,15,20,.92);color:#fff;text-align:center;
 z-index:9999;box-shadow:0 5px 25px rgba(0,0,0,.4)
}
#status{font-size:18px;font-weight:bold;margin-bottom:8px}
.section{font-size:13px;color:#aaa;margin:8px 0 5px}
.row{display:flex;gap:7px;justify-content:center;margin-top:7px}
button{
 flex:1;min-height:44px;border:0;border-radius:11px;
 color:#fff;font-size:13px;font-weight:bold;cursor:pointer
}
button:active{transform:scale(.96)}
.blue{background:#1677ff}.green{background:#16a34a}
.orange{background:#f59e0b}.gray{background:#555}
#hint{font-size:11px;color:#bbb;margin-top:8px}
</style>
</head>

<body>

<a-scene
 embedded
 vr-mode-ui="enabled:false"
 renderer="colorManagement:true; logarithmicDepthBuffer:true"
 arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best">

 <a-marker id="hiro-marker" preset="hiro">

   <!-- กลุ่มคอมพิวเตอร์ -->
   <a-entity id="computer" position="0 0 0" rotation="0 0 0">

     <!-- จอภาพ -->
     <a-box position="0 1.25 0"
            width="1.65" height="1.05" depth="0.12"
            color="#20242a"></a-box>

     <!-- หน้าจอ -->
     <a-plane id="screen"
              position="0 1.25 0.067"
              width="1.48" height="0.82"
              material="color:#1677ff"></a-plane>

     <!-- แถบด้านล่างจอ -->
     <a-box position="0 0.73 0"
            width="0.35" height="0.12" depth="0.18"
            color="#333"></a-box>

     <!-- ฐานจอ -->
     <a-box position="0 0.58 0"
            width="0.85" height="0.08" depth="0.45"
            color="#333"></a-box>

     <!-- เคสคอม -->
     <a-box position="0.95 0.65 0"
            width="0.42" height="0.85" depth="0.65"
            color="#30343a"></a-box>

     <!-- ปุ่ม Power -->
     <a-cylinder position="0.95 0.72 0.335"
                  rotation="90 0 0"
                  radius="0.055" height="0.025"
                  color="#27d17f"></a-cylinder>

     <!-- คีย์บอร์ด -->
     <a-box position="0 0.35 0.38"
            width="1.35" height="0.08" depth="0.48"
            color="#292d32"
            rotation="-8 0 0"></a-box>

     <!-- เมาส์ -->
     <a-box position="0.78 0.34 0.4"
            width="0.22" height="0.08" depth="0.30"
            color="#3b3f45"
            rotation="-8 0 0"></a-box>

   </a-entity>

 </a-marker>

 <a-entity camera></a-entity>
</a-scene>

<div id="panel">
 <div id="status">📷 กำลังค้นหา Hiro Marker...</div>

 <div class="section">🖥️ เปลี่ยนหน้าจอ</div>
 <div class="row">
   <button class="blue" data-screen="work">💼 งาน</button>
   <button class="green" data-screen="game">🎮 เกม</button>
   <button class="orange" data-screen="code">💻 Code</button>
   <button class="gray" data-screen="blank">⬛ ว่าง</button>
 </div>

 <div class="section">🔄 ปรับมุมมองตัวเครื่อง</div>
 <div class="row">
   <button class="gray" id="left">↶ หมุนซ้าย</button>
   <button class="gray" id="front">🎯 ด้านหน้า</button>
   <button class="gray" id="right">หมุนขวา ↷</button>
 </div>

 <div class="row">
   <button class="blue" id="up">⬆️ มุมสูง</button>
   <button class="blue" id="down">⬇️ มุมต่ำ</button>
   <button class="green" id="reset">🔄 รีเซ็ต</button>
 </div>

 <div id="hint">ส่องกล้องไปที่ Hiro Marker</div>
</div>

<script>
const computer = document.getElementById("computer");
const screen = document.getElementById("screen");
const marker = document.getElementById("hiro-marker");
const statusText = document.getElementById("status");
const hint = document.getElementById("hint");

let rotY = 0;
let rotX = 0;

const screens = {
 work: {color:"#1677ff"},
 game:{color:"#16a34a"},
 code:{color:"#7c3aed"},
 blank:{color:"#111827"}
};

function updateView(){
 computer.setAttribute("rotation", `${rotX} ${rotY} 0`);
}

function setScreen(name){
 const s = screens[name];
 if(!s) return;

 screen.setAttribute("material", "color:" + s.color);

 if(name === "work") hint.textContent = "หน้าจอโหมดทำงาน";
 if(name === "game") hint.textContent = "หน้าจอโหมดเกม";
 if(name === "code") hint.textContent = "หน้าจอโหมดเขียนโปรแกรม";
 if(name === "blank") hint.textContent = "หน้าจอว่าง";
}

document.querySelectorAll("[data-screen]").forEach(btn=>{
 btn.addEventListener("click",()=>setScreen(btn.dataset.screen));
});

document.getElementById("left").addEventListener("click",()=>{
 rotY -= 15;
 updateView();
});

document.getElementById("right").addEventListener("click",()=>{
 rotY += 15;
 updateView();
});

document.getElementById("front").addEventListener("click",()=>{
 rotY = 0;
 rotX = 0;
 updateView();
});

document.getElementById("up").addEventListener("click",()=>{
 rotX = Math.max(-25, rotX - 10);
 updateView();
});

document.getElementById("down").addEventListener("click",()=>{
 rotX = Math.min(25, rotX + 10);
 updateView();
});

document.getElementById("reset").addEventListener("click",()=>{
 rotY = 0;
 rotX = 0;
 updateView();
 setScreen("work");
});

marker.addEventListener("markerFound",()=>{
 statusText.textContent = "🖥️ พบคอมพิวเตอร์แล้ว";
 hint.textContent = "เลือกหน้าจอหรือปรับมุมมองตัวเครื่องได้";
});

marker.addEventListener("markerLost",()=>{
 statusText.textContent = "📷 กำลังค้นหา Hiro Marker...";
 hint.textContent = "ส่องกล้องไปที่ Hiro Marker";
});

setScreen("work");
updateView();
</script>

</body>
</html>
